on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@latest

      - name: Generate
        working-directory: src
        run: templ generate

      - name: Test
        working-directory: src
        run: make test
